# 28q 三轮演练本地栈编排（与现运行容器逐项一致；重建用）
# 生产同构：nginx + php(kjlion 同构 r28q-php:8.3, PHP 8.3.36) + mysql + redis + r28q-host(模拟生产 SSH 宿主机)
# 宿主/容器路径对照见 deploy/RUNBOOK-launch.md @6f4aac1 §0
services:
  php:
    image: r28q-php:8.3            # WP 7.1.3 / PHP 8.3.36 / wp-cli /usr/local/bin/wp
    working_dir: /var/www/html
    command: ["php-fpm"]
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wp        # 由 rehearsal/seed.sql 灌入（mysql 容器 MARIADB_DATABASE 只建 www_packrivo_com）
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: r28qlocal
      WORDPRESS_DEBUG: "1"
    volumes:
      - ./home/web/html:/var/www/html
    networks: [r28q-net]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8091:80"                   # 演练站点入口 http://localhost:8091（容器内 host 名 nginx）
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./home/web/html:/var/www/html:ro
    networks: [r28q-net]
    restart: unless-stopped

  mysql:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: r28qlocal
      MARIADB_DATABASE: www_packrivo_com
    volumes:
      - ./home/web/html:/var/www/html   # 与现运行容器一致（历史遗留挂载，保留原样）
    networks: [r28q-net]
    restart: unless-stopped

  redis:
    image: redis:alpine             # §0 生产栈含 redis；本地 2026-10-28 补齐
    networks: [r28q-net]
    restart: unless-stopped

  r28q-host:
    image: docker:27-cli            # 模拟生产 SSH 宿主机：宿主侧无 php/wp，docker-in-docker
    command: ["sh", "-c", "apk add --no-cache git curl bash tar >/tmp/apk.log 2>&1 || cat /tmp/apk.log; exec sleep infinity"]
    volumes:
      - ./home/web:/home/web        # 生产同构：$WP/$PKG/$BACKUP 都在 /home/web 下
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [r28q-net]
    restart: unless-stopped

networks:
  r28q-net:
    name: r28q-net
